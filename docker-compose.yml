version: '3.8'

services:
  stock-api:
    # 로컬 빌드 사용
    # build: .
    # 또는 GHCR에서 이미지 사용 (주석 해제)
    image: ghcr.io/${GITHUB_USERNAME}/${GITHUB_REPO}:latest
    container_name: stock-portfolio-api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - DEBUG=True
      - DART_API_KEY=${DART_API_KEY}
    volumes:
      # 데이터 캐시 영구 저장 (선택사항)
      - ./data:/app/data
      # 환경변수 파일 마운트
      - ./.env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
